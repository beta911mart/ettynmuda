<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETTYN SHOP - Etalase Materi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], },
                    colors: {
                        krem: '#FAF3E0', pinkmuda: '#F4C2C2', textgelap: '#4A3B32',
                        pastelPink: { light: '#FADADD', DEFAULT: '#F4C2C2', dark: '#D77A7A' },
                        brown: { DEFAULT: '#6B5B53', dark: '#4A3B32' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF3E0; color: #4A3B32; 
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cg fill='none' stroke='%234A3B32' stroke-width='2' opacity='0.05'%3E%3Cpath d='M50 60 h50 v60 h-50 z' /%3E%3Cpath d='M50 60 l-15 -15 h50 l15 15' /%3E%3Cpath d='M100 60 l-15 -15 v60 l15 15' /%3E%3Cpath d='M55 75 h35 M55 90 h35 M55 105 h35' /%3E%3Cpath d='M300 70 l25 -25 l15 15 l-25 25 z' /%3E%3Cpath d='M300 70 l-35 35 l15 15 l35 -35' /%3E%3Cpath d='M265 105 l-12 18 l18 -12' /%3E%3Ctext x='160' y='80' font-family='Georgia, serif' font-size='28' font-style='italic' fill='%234A3B32' stroke='none'%3EE=mc²%3C/text%3E%3Ctext x='60' y='240' font-family='Georgia, serif' font-size='36' fill='%234A3B32' stroke='none'%3Eπ%3C/text%3E%3Ctext x='290' y='280' font-family='Georgia, serif' font-size='28' fill='%234A3B32' stroke='none'%3E∫ x dx%3C/text%3E%3Ctext x='160' y='330' font-family='Georgia, serif' font-size='26' fill='%234A3B32' stroke='none'%3E√a²+b²%3C/text%3E%3Crect x='170' y='210' width='60' height='60' /%3E%3Cpath d='M170 210 l20 -20 h60 l-20 20' /%3E%3Cpath d='M230 210 l20 -20 v60 l-20 20' /%3E%3Cpath d='M80 300 v60 h60 z' /%3E%3Ccircle cx='95' cy='340' r='4' fill='%234A3B32' /%3E%3Ccircle cx='115' cy='340' r='4' fill='%234A3B32' /%3E%3Ccircle cx='330' cy='160' r='35' /%3E%3Cellipse cx='330' cy='160' rx='35' ry='12' transform='rotate(45 330 160)' /%3E%3Cellipse cx='330' cy='160' rx='35' ry='12' transform='rotate(-45 330 160)' /%3E%3Ccircle cx='330' cy='160' r='5' fill='%234A3B32' /%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat; background-attachment: fixed;
            -webkit-touch-callout: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }

        .preview-container { position: relative; overflow: hidden; border-radius: 0.75rem 0.75rem 0 0; }
        .watermark-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.05); pointer-events: none; z-index: 10; overflow: hidden;
        }
        .watermark-text {
            color: rgba(255, 255, 255, 0.6); font-size: 1.25rem; font-weight: bold;
            text-transform: uppercase; transform: rotate(-30deg); white-space: nowrap;
            letter-spacing: 2px; text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="sticky top-0 bg-krem/90 backdrop-blur-md z-40 border-b border-pinkmuda shadow-sm p-4 sm:p-6 transition-all">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-textgelap flex items-center justify-center sm:justify-start gap-2">
                    <i class="fas fa-store text-pastelPink-dark"></i> ETTYN SHOP
                </h1>
                <p class="text-sm mt-1 text-brown font-medium">Etalase Materi & Dokumen Akademis</p>
            </div>
            <a href="/" class="bg-pastelPink-dark hover:bg-brown-dark text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md flex items-center gap-2">
                <i class="fas fa-home"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- KONTEN ETALASE -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6 mt-4 flex-grow w-full relative z-10">
        
        <div class="mb-6 text-center md:text-left">
            <div class="inline-block bg-pinkmuda/60 px-5 py-2 rounded-full mb-3 shadow-sm border border-pinkmuda/50">
                <h2 class="text-xl font-bold text-textgelap">Katalog Produk Digital</h2>
            </div>
            <p class="text-brown opacity-90 text-sm font-medium">Temukan berbagai dokumen dan materi pendukung belajar Anda.</p>
        </div>

        <!-- PANEL KONTROL FILTER -->
        <div class="bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-pinkmuda shadow-sm flex flex-col lg:flex-row gap-3 mb-8">
            <div class="flex-1 relative">
                <i class="fas fa-search absolute left-4 top-3.5 text-brown opacity-50"></i>
                <input type="text" id="searchInput" oninput="terapkanFilter()" placeholder="Cari nama materi..." class="w-full pl-11 pr-4 py-3 rounded-xl border border-pinkmuda/70 bg-white focus:outline-none focus:border-pastelPink-dark text-sm shadow-sm">
            </div>
            <div class="flex flex-wrap gap-2 lg:gap-3">
                <select id="filterTingkat" onchange="terapkanFilter()" class="flex-1 lg:flex-none px-3 py-3 rounded-xl border border-pinkmuda/70 bg-white focus:outline-none text-sm text-textgelap shadow-sm cursor-pointer">
                    <option value="all">Semua Tingkat</option>
                    <option value="TK / Sederajat">TK / Sederajat</option>
                    <option value="SD / Sederajat">SD / Sederajat</option>
                    <option value="SMP / Sederajat">SMP / Sederajat</option>
                    <option value="SLTA / Sederajat">SLTA / Sederajat</option>
                </select>
                <select id="filterKategori" onchange="terapkanFilter()" class="flex-1 lg:flex-none px-3 py-3 rounded-xl border border-pinkmuda/70 bg-white focus:outline-none text-sm text-textgelap shadow-sm cursor-pointer">
                    <option value="all">Semua Kategori</option>
                    <option value="Proposal">Proposal</option><option value="Modul">Modul</option>
                    <option value="LKPD">LKPD</option><option value="Presentasi">Presentasi</option>
                    <option value="Laporan">Laporan</option><option value="Surat">Surat</option>
                    <option value="Bahan ajar">Bahan Ajar</option>
                </select>
                <select id="filterFormat" onchange="terapkanFilter()" class="flex-1 lg:flex-none px-3 py-3 rounded-xl border border-pinkmuda/70 bg-white focus:outline-none text-sm text-textgelap shadow-sm cursor-pointer">
                    <option value="all">Semua Format</option>
                    <option value="PDF">PDF</option><option value="PPT">PPT</option>
                    <option value="Word">Word</option><option value="Image">Image</option>
                    <option value="Video">Video</option>
                </select>
                <select id="sortUrutan" onchange="terapkanFilter()" class="flex-1 lg:flex-none px-3 py-3 rounded-xl border border-pinkmuda/70 bg-white focus:outline-none text-sm text-textgelap shadow-sm cursor-pointer">
                    <option value="default">Urutkan</option>
                    <option value="harga_asc">Harga: Termurah</option><option value="harga_desc">Harga: Termahal</option>
                    <option value="nama_asc">Nama: A - Z</option><option value="nama_desc">Nama: Z - A</option>
                </select>
            </div>
        </div>

        <!-- Grid Produk -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-12">
            <div class="col-span-full text-center py-12 text-brown font-medium" id="loadingIndicator">
                <i class="fas fa-spinner fa-spin text-3xl mb-3 text-pastelPink-dark"></i><br>Memuat katalog produk...
            </div>
        </div>
    </main>

    <!-- MODAL SLIDER & VIDEO PREVIEW -->
    <div id="mediaModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 transition-opacity" onclick="tutupModal()">
        <div class="relative bg-white rounded-2xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-pinkmuda" onclick="event.stopPropagation()">
            
            <div class="flex justify-between items-center bg-pastelPink-dark text-white px-5 py-3.5">
                <h3 id="modalTitle" class="font-bold text-sm truncate pr-4">Preview Dokumen</h3>
                <button onclick="tutupModal()" class="text-white hover:text-pink-100 font-bold text-2xl px-2 leading-none focus:outline-none">&times;</button>
            </div>
            
            <!-- Kontainer Media (Gambar/Video) -->
            <div id="mediaContainer" class="p-0 overflow-hidden flex justify-center items-center bg-gray-900 relative min-h-[40vh] md:min-h-[65vh] group w-full">
                <!-- Elemen akan diinjeksi via JavaScript -->
            </div>
            
            <!-- Watermark Overlay khusus Modal -->
            <div class="absolute inset-x-0 top-[60px] bottom-[60px] flex items-center justify-center pointer-events-none z-10">
                <span class="text-white text-2xl md:text-5xl font-bold uppercase opacity-20 transform -rotate-12 tracking-widest drop-shadow-lg">Dokumen Etyyn Muda</span>
            </div>

            <!-- Tombol Navigasi -->
            <button id="prevBtn" onclick="gantiSlide(-1, event)" class="absolute left-2 md:left-6 top-1/2 transform -translate-y-1/2 bg-black/40 hover:bg-pastelPink-dark text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition backdrop-blur-sm z-20 hidden shadow-md">
                <i class="fas fa-chevron-left text-lg"></i>
            </button>
            <button id="nextBtn" onclick="gantiSlide(1, event)" class="absolute right-2 md:right-6 top-1/2 transform -translate-y-1/2 bg-black/40 hover:bg-pastelPink-dark text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition backdrop-blur-sm z-20 hidden shadow-md">
                <i class="fas fa-chevron-right text-lg"></i>
            </button>
            
            <div id="slideIndicator" class="absolute bottom-16 left-1/2 transform -translate-x-1/2 bg-black/60 text-white px-4 py-1.5 text-xs rounded-full tracking-widest font-bold hidden z-20 shadow-md">
                1 / 1
            </div>
            
            <div class="p-4 bg-krem flex justify-end border-t border-pinkmuda/30 z-20 relative">
                <button onclick="tutupModal()" class="bg-brown hover:bg-textgelap text-white font-medium px-6 py-2 rounded-xl text-sm transition-colors shadow-sm">Tutup Preview</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center p-8 text-brown text-sm mt-auto border-t border-pinkmuda/30 bg-krem/80 backdrop-blur-sm">
        <p class="font-medium opacity-80">&copy; 2026 ETTYN SHOP. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        // PASTIKAN URL WEB APP GAS ANDA TEPAT
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwjEvkS8po1LcYzW1j-8z8bm_vLr_QQsrkwHVoykheVafC6-ocb-BS4Lmac5cf1EL7C/exec";
        let semuaProduk = []; 

        async function muatProduk() {
            const container = document.getElementById('product-grid');
            try {
                let response = await fetch(SHEET_API_URL);
                semuaProduk = await response.json();
                if (semuaProduk.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-brown font-medium bg-white/70 backdrop-blur-sm rounded-2xl border border-pinkmuda/30 shadow-sm">Belum ada produk di etalase.</div>';
                    return;
                }
                terapkanFilter();
            } catch (error) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-500 font-medium bg-white/70 border border-red-200 shadow-sm">Gagal memuat data produk. Periksa kembali koneksi atau URL API Anda.</div>';
            }
        }

        // FUNGSI BANTUAN UNTUK MENDETEKSI ID YOUTUBE & SHORTS
        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function terapkanFilter() {
            const container = document.getElementById('product-grid');
            let kataKunci = document.getElementById('searchInput').value.toLowerCase();
            let tingkatDipilih = document.getElementById('filterTingkat').value;
            let katDipilih = document.getElementById('filterKategori').value;
            let formatDipilih = document.getElementById('filterFormat').value;
            let urutanDipilih = document.getElementById('sortUrutan').value;

            let produkTersaring = semuaProduk.filter(p => {
                let cocokKataKunci = (p.nama || "").toLowerCase().includes(kataKunci);
                let cocokTingkat = (tingkatDipilih === 'all') || ((p.tingkat || "").toLowerCase() === tingkatDipilih.toLowerCase());
                let cocokKategori = (katDipilih === 'all') || ((p.kategori || "").toLowerCase() === katDipilih.toLowerCase());
                let cocokFormat = (formatDipilih === 'all') || ((p.format || "").toLowerCase() === formatDipilih.toLowerCase());
                return cocokKataKunci && cocokTingkat && cocokKategori && cocokFormat;
            });

            if (urutanDipilih === 'harga_asc') produkTersaring.sort((a, b) => Number(a.harga) - Number(b.harga));
            else if (urutanDipilih === 'harga_desc') produkTersaring.sort((a, b) => Number(b.harga) - Number(a.harga));
            else if (urutanDipilih === 'nama_asc') produkTersaring.sort((a, b) => (a.nama || "").localeCompare(b.nama || ""));
            else if (urutanDipilih === 'nama_desc') produkTersaring.sort((a, b) => (b.nama || "").localeCompare(a.nama || ""));

            container.innerHTML = ''; 
            if (produkTersaring.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-brown font-medium bg-white/70 shadow-sm"><i class="fas fa-box-open text-3xl mb-3 text-pastelPink"></i><br>Oops! Produk yang Anda cari tidak ditemukan.</div>';
                return;
            }

            produkTersaring.forEach(p => {
                let hargaArray = p.harga.toString().split('|');
                let nominal = hargaArray[0] || 0;
                let satuan = hargaArray[1] ? `<span class="text-xs font-medium text-pink-700 ml-1">${hargaArray[1]}</span>` : '';
                let hargaFormatted = Number(nominal).toLocaleString('id-ID') + satuan;
                
                let daftarGambarArray = p.imgUrl ? p.imgUrl.split(',') : [''];
                let thumbnailUtama = daftarGambarArray[0].trim();
                
                let coverUrl = thumbnailUtama;
                let isVideoIcon = '';
                
                // Deteksi jika Thumbnail pertama adalah YouTube / Shorts
                if (thumbnailUtama.includes('youtube.com') || thumbnailUtama.includes('youtu.be')) {
                    let ytId = extractYouTubeId(thumbnailUtama);
                    if(ytId) coverUrl = `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`;
                    isVideoIcon = `<div class="absolute inset-0 flex items-center justify-center"><i class="fas fa-play-circle text-white text-4xl opacity-80 drop-shadow-md"></i></div>`;
                }
                
                let imgStringSafe = (p.imgUrl || "").replace(/'/g, "\\'");
                let namaSafe = (p.nama || "").replace(/'/g, "\\'");
                
                let card = `
                <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-pinkmuda/50 overflow-hidden flex flex-col justify-between hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                    <div>
                        <div class="preview-container h-48 bg-gray-200 relative group cursor-pointer border-b border-pinkmuda/30" onclick="bukaModal('${imgStringSafe}', '${namaSafe}')">
                            <img src="${coverUrl}" alt="Preview" class="w-full h-full object-cover">
                            ${isVideoIcon}
                            <div class="watermark-overlay"><div class="watermark-text">Etyyn Muda</div></div>
                            ${daftarGambarArray.length > 1 ? `<div class="absolute top-2 right-2 bg-black/70 text-white text-[10px] px-2 py-0.5 rounded-md backdrop-blur-sm"><i class="fas fa-layer-group"></i> ${daftarGambarArray.length} Slide</div>` : ''}
                            <div class="absolute inset-0 bg-textgelap/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                                <span class="bg-white/90 text-textgelap text-xs px-4 py-2 rounded-full font-bold shadow-lg flex items-center gap-1.5 transform scale-95 group-hover:scale-100 transition-transform">
                                    <i class="fas fa-play"></i> Lihat Preview
                                </span>
                            </div>
                        </div>
                        
                        <div class="p-5 pb-3">
                            <div class="mb-3 flex flex-wrap gap-2">
                                <span class="inline-block bg-pastelPink-light text-brown-dark text-[10px] px-2.5 py-1 rounded-md font-bold uppercase tracking-wider">${p.kategori || '-'}</span>
                                <span class="inline-block bg-krem text-brown-dark text-[10px] px-2.5 py-1 rounded-md font-bold uppercase"><i class="fas fa-graduation-cap mr-1"></i> ${p.tingkat || 'Umum'}</span>
                            </div>
                            <h3 class="font-bold text-lg text-textgelap line-clamp-2 leading-tight mb-2">${p.nama}</h3>
                            <p class="text-xs text-brown opacity-90 font-medium"><i class="fas fa-file-alt text-pastelPink-dark"></i> Format: ${p.format || '-'}</p>
                        </div>
                    </div>
                    
                    <div class="p-5 pt-3 flex justify-between items-center border-t border-pinkmuda/20 bg-krem/30">
                        <span class="font-bold text-pastelPink-dark text-lg">Rp ${hargaFormatted}</span>
                        <button onclick="beliProduk('${namaSafe}')" class="bg-pastelPink-dark text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-brown-dark transition-colors flex items-center gap-1.5">
                            <i class="fab fa-whatsapp text-base"></i> Beli
                        </button>
                    </div>
                </div>`;
                container.innerHTML += card;
            });
        }

        muatProduk();

        // === KEAMANAN & ANTI MALING ===
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey || event.metaKey) {
                const blockedKeys = ['c', 's', 'p', 'u', 'a', 'x'];
                if (blockedKeys.includes(event.key.toLowerCase())) event.preventDefault();
            }
            if (event.key === "F12") event.preventDefault();
        });


        // === LOGIKA SLIDER MULTIMEDIA (GAMBAR & VIDEO) ===
        let slideMediaArray = [];
        let currentSlideIndex = 0;
        let autoSlideTimer;

        function bukaModal(mediaStringData, title) {
            slideMediaArray = mediaStringData.split(',').map(url => url.trim()).filter(url => url !== "");
            currentSlideIndex = 0;

            document.getElementById('modalTitle').innerText = "Preview: " + title;
            document.getElementById('mediaModal').classList.remove('hidden');
            
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const indikator = document.getElementById('slideIndicator');

            if(slideMediaArray.length > 1) {
                prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden'); indikator.classList.remove('hidden');
            } else {
                prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden'); indikator.classList.add('hidden');
            }

            renderMediaSlide();
        }

        function renderMediaSlide() {
            if(slideMediaArray.length === 0) return;
            const container = document.getElementById('mediaContainer');
            const currentMedia = slideMediaArray[currentSlideIndex];
            
            container.innerHTML = ''; // Bersihkan elemen sebelumnya
            container.style.opacity = 0;

            let isVideo = false;

            if (currentMedia.includes('youtube.com') || currentMedia.includes('youtu.be')) {
                // RENDER YOUTUBE (Termasuk Shorts)
                isVideo = true;
                let ytId = extractYouTubeId(currentMedia);
                container.innerHTML = `<iframe class="w-full h-full aspect-video md:aspect-auto md:h-[65vh] object-cover" src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } 
            else if (currentMedia.match(/\.(mp4|webm|ogg)$/i)) {
                // RENDER VIDEO MP4 LANGSUNG
                isVideo = true;
                container.innerHTML = `<video class="max-h-[65vh] md:max-h-[75vh] object-contain w-full" controls autoplay controlsList="nodownload"><source src="${currentMedia}" type="video/mp4">Browser Anda tidak mendukung tag video.</video>`;
            } 
            else {
                // RENDER GAMBAR
                container.innerHTML = `<img src="${currentMedia}" class="max-h-[65vh] md:max-h-[75vh] object-contain shadow-lg">`;
            }

            // Transisi Halus
            setTimeout(() => { container.style.opacity = 1; }, 50);
            document.getElementById('slideIndicator').innerText = (currentSlideIndex + 1) + " / " + slideMediaArray.length;

            // Atur Ulang Auto-Slide (Video tidak akan di-skip otomatis)
            hentikanAutoSlide();
            if (!isVideo && slideMediaArray.length > 1) {
                mulaiAutoSlide();
            }
        }

        function gantiSlide(arah, event) {
            if(event) event.stopPropagation();
            currentSlideIndex += arah;
            if(currentSlideIndex >= slideMediaArray.length) currentSlideIndex = 0;
            if(currentSlideIndex < 0) currentSlideIndex = slideMediaArray.length - 1;
            renderMediaSlide();
        }

        function mulaiAutoSlide() {
            autoSlideTimer = setInterval(() => { gantiSlide(1, null); }, 3500);
        }

        function hentikanAutoSlide() {
            if(autoSlideTimer) clearInterval(autoSlideTimer);
        }

        function tutupModal() {
            document.getElementById('mediaModal').classList.add('hidden');
            document.getElementById('mediaContainer').innerHTML = ""; // Hentikan audio video
            hentikanAutoSlide();
        }

        function beliProduk(namaProduk) {
            const noWA = "6281237827324";
            const pesan = encodeURIComponent(`Halo Kak Etyyn, saya tertarik dan ingin membeli materi: *${namaProduk}* di ETTYN SHOP. Mohon info pembayaran selanjutnya.`);
            window.open(`https://wa.me/${noWA}?text=${pesan}`, '_blank');
        }
    </script>
</body>
</html>
