<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETTYN SHOP - Etalase Materi</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        krem: '#FAF3E0',
                        pinkmuda: '#F4C2C2',
                        textgelap: '#4A3B32',
                        pastelPink: {
                            light: '#FADADD',
                            DEFAULT: '#F4C2C2',
                            dark: '#D77A7A'
                        },
                        brown: {
                            DEFAULT: '#6B5B53',
                            dark: '#4A3B32'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Latar Belakang Edukasi Tersinkronisasi dengan index.html */
        body {
            background-color: #FAF3E0; 
            color: #4A3B32; 
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Cg fill='none' stroke='%234A3B32' stroke-width='2' opacity='0.05'%3E%3C!-- Buku --%3E%3Cpath d='M50 60 h50 v60 h-50 z' /%3E%3Cpath d='M50 60 l-15 -15 h50 l15 15' /%3E%3Cpath d='M100 60 l-15 -15 v60 l15 15' /%3E%3Cpath d='M55 75 h35 M55 90 h35 M55 105 h35' /%3E%3C!-- Pena/Pensil --%3E%3Cpath d='M300 70 l25 -25 l15 15 l-25 25 z' /%3E%3Cpath d='M300 70 l-35 35 l15 15 l35 -35' /%3E%3Cpath d='M265 105 l-12 18 l18 -12' /%3E%3C!-- Rumus --%3E%3Ctext x='160' y='80' font-family='Georgia, serif' font-size='28' font-style='italic' fill='%234A3B32' stroke='none'%3EE=mc²%3C/text%3E%3Ctext x='60' y='240' font-family='Georgia, serif' font-size='36' fill='%234A3B32' stroke='none'%3Eπ%3C/text%3E%3Ctext x='290' y='280' font-family='Georgia, serif' font-size='28' fill='%234A3B32' stroke='none'%3E∫ x dx%3C/text%3E%3Ctext x='160' y='330' font-family='Georgia, serif' font-size='26' fill='%234A3B32' stroke='none'%3E√a²+b²%3C/text%3E%3C!-- Bentuk Ruang Kubus --%3E%3Crect x='170' y='210' width='60' height='60' /%3E%3Cpath d='M170 210 l20 -20 h60 l-20 20' /%3E%3Cpath d='M230 210 l20 -20 v60 l-20 20' /%3E%3C!-- Segitiga Penggaris --%3E%3Cpath d='M80 300 v60 h60 z' /%3E%3Ccircle cx='95' cy='340' r='4' fill='%234A3B32' /%3E%3Ccircle cx='115' cy='340' r='4' fill='%234A3B32' /%3E%3C!-- Bola / Atom --%3E%3Ccircle cx='330' cy='160' r='35' /%3E%3Cellipse cx='330' cy='160' rx='35' ry='12' transform='rotate(45 330 160)' /%3E%3Cellipse cx='330' cy='160' rx='35' ry='12' transform='rotate(-45 330 160)' /%3E%3Ccircle cx='330' cy='160' r='5' fill='%234A3B32' /%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
            background-attachment: fixed;
            
            /* Proteksi Select Text */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .preview-container {
            position: relative;
            overflow: hidden;
            border-radius: 0.75rem 0.75rem 0 0;
        }

        .watermark-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
        }

        .watermark-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.25rem;
            font-weight: bold;
            text-transform: uppercase;
            transform: rotate(-30deg);
            white-space: nowrap;
            letter-spacing: 2px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

    <!-- Header dengan Glassmorphism sesuai index.html -->
    <header class="sticky top-0 bg-krem/90 backdrop-blur-md z-40 border-b border-pinkmuda shadow-sm p-4 sm:p-6 transition-all">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-textgelap flex items-center justify-center sm:justify-start gap-2">
                    <i class="fas fa-store text-pastelPink-dark"></i> ETTYN SHOP
                </h1>
                <p class="text-sm mt-1 text-brown font-medium">Etalase Materi & Dokumen Akademis</p>
            </div>
            <a href='#' class="bg-pastelPink-dark hover:bg-brown-dark text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-all shadow-md flex items-center gap-2">
                <i class="fas fa-home"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Main Content (Etalase) -->
    <main class="max-w-6xl mx-auto p-4 sm:p-6 mt-4 flex-grow w-full relative z-10">
        
        <div class="mb-8 text-center md:text-left">
            <div class="inline-block bg-pinkmuda/60 px-5 py-2 rounded-full mb-3 shadow-sm border border-pinkmuda/50">
                <h2 class="text-xl font-bold text-textgelap">Katalog Produk Digital</h2>
            </div>
            <p class="text-brown opacity-90 text-sm font-medium">Klik tombol "Perbesar Preview" untuk melihat cuplikan halaman materi.</p>
        </div>

        <!-- Grid Produk Dinamis dari Google Sheets -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-12">
            <!-- Indikator Loading -->
            <div class="col-span-full text-center py-12 text-brown font-medium">
                <i class="fas fa-spinner fa-spin text-3xl mb-3 text-pastelPink-dark"></i><br>
                Memuat katalog produk...
            </div>
        </div>
    </main>

    <!-- MODAL POPUP UNTUK PERBESAR GAMBAR -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 transition-opacity" onclick="tutupModal()">
        <div class="relative bg-white rounded-2xl overflow-hidden max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-pinkmuda" onclick="event.stopPropagation()">
            <!-- Modal Header -->
            <div class="flex justify-between items-center bg-pastelPink-dark text-white px-5 py-3.5">
                <h3 id="modalTitle" class="font-bold text-sm truncate pr-4">Preview Dokumen</h3>
                <button onclick="tutupModal()" class="text-white hover:text-pink-100 font-bold text-xl px-2 transition-colors focus:outline-none">&times;</button>
            </div>
            <!-- Modal Image Container -->
            <div class="p-4 overflow-auto flex justify-center items-center bg-gray-900 relative">
                <img id="modalImage" src="" alt="Zoom Preview" class="max-h-[65vh] md:max-h-[75vh] object-contain rounded-md shadow-lg">
                <!-- Watermark Besar -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="text-white text-2xl md:text-5xl font-bold uppercase opacity-20 transform -rotate-12 tracking-widest drop-shadow-lg">Dokumen Etyyn Muda</span>
                </div>
            </div>
            <!-- Modal Footer -->
            <div class="p-4 bg-krem flex justify-end border-t border-pinkmuda/30">
                <button onclick="tutupModal()" class="bg-brown hover:bg-textgelap text-white font-medium px-6 py-2 rounded-xl text-sm transition-colors shadow-sm">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center p-8 text-brown text-sm mt-auto relative z-10 border-t border-pinkmuda/30 bg-krem/80 backdrop-blur-sm">
        <p class="font-medium opacity-80">&copy; 2026 ETTYN SHOP. Semua Hak Dilindungi.</p>
    </footer>

    <!-- SCRIPT UTAMA & DINAMIS -->
    <script>
        // Ganti URL di bawah ini dengan URL Web App Google Apps Script Anda
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwjEvkS8po1LcYzW1j-8z8bm_vLr_QQsrkwHVoykheVafC6-ocb-BS4Lmac5cf1EL7C/exec";

        async function muatProduk() {
            const container = document.getElementById('product-grid');
            try {
                let response = await fetch(SHEET_API_URL);
                let products = await response.json();

                if (products.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-brown font-medium bg-white/70 backdrop-blur-sm rounded-2xl border border-pinkmuda/30 shadow-sm">Belum ada produk di etalase.</div>';
                    return;
                }

                container.innerHTML = ''; // Kosongkan loading

                products.forEach(p => {
                    let hargaFormatted = Number(p.harga).toLocaleString('id-ID');
                    let card = `
                    <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-sm border border-pinkmuda/50 overflow-hidden flex flex-col justify-between hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                        <div>
                            <div class="preview-container h-48 bg-gray-200 relative group cursor-pointer border-b border-pinkmuda/30" onclick="bukaModal('${p.imgUrl}', '${p.nama}')">
                                <img src="${p.imgUrl}" alt="Preview" class="w-full h-full object-cover">
                                <div class="watermark-overlay">
                                    <div class="watermark-text">Etyyn Muda</div>
                                </div>
                                <div class="absolute inset-0 bg-textgelap/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                                    <span class="bg-white/90 text-textgelap text-xs px-4 py-2 rounded-full font-bold shadow-lg flex items-center gap-1.5 transform scale-95 group-hover:scale-100 transition-transform">
                                        <i class="fas fa-search-plus"></i> Perbesar
                                    </span>
                                </div>
                            </div>
                            <div class="p-5 pb-3">
                                <h3 class="font-bold text-lg text-textgelap line-clamp-2 leading-tight">${p.nama}</h3>
                                <p class="text-xs text-brown opacity-80 mt-1.5 font-medium"><i class="fas fa-file-alt mr-1"></i> ${p.format}</p>
                            </div>
                        </div>
                        <div class="p-5 pt-3 flex justify-between items-center border-t border-pinkmuda/20 bg-krem/30">
                            <span class="font-bold text-pastelPink-dark text-lg">Rp ${hargaFormatted}</span>
                            <button onclick="beliProduk('${p.nama.replace(/'/g, "\\'")}')" class="bg-pastelPink-dark text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-brown-dark transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="fab fa-whatsapp text-base"></i> Beli
                            </button>
                        </div>
                    </div>`;
                    container.innerHTML += card;
                });
            } catch (error) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-500 font-medium bg-white/70 backdrop-blur-sm rounded-2xl border border-red-200 shadow-sm"><i class="fas fa-exclamation-triangle text-3xl mb-3"></i><br>Gagal memuat data produk. Periksa kembali koneksi atau URL API Anda.</div>';
                console.error("Error:", error);
            }
        }

        // Jalankan fungsi saat halaman dibuka
        muatProduk();

        // Keamanan: Blokir klik kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Keamanan: Blokir shortcut tertentu
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey || event.metaKey) {
                const blockedKeys = ['c', 's', 'p', 'u', 'a', 'x'];
                if (blockedKeys.includes(event.key.toLowerCase())) {
                    event.preventDefault();
                }
            }
            if (event.key === "F12") event.preventDefault();
        });

        // Kontrol Modal (Perbesar Gambar)
        function bukaModal(imageSrc, title) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('modalTitle').innerText = "Preview: " + title;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function tutupModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalImage').src = ""; // Clear source to stop showing previous image
        }

        // Action Klik Beli via WA
        function beliProduk(namaProduk) {
            const noWA = "6281237827324"; // Sesuai nomor WhatsApp pada index.html
            const pesan = encodeURIComponent(`Halo Kak Etyyn, saya tertarik dan ingin membeli materi: *${namaProduk}* di ETTYN SHOP. Mohon info pembayaran selanjutnya.`);
            window.open(`https://wa.me/${noWA}?text=${pesan}`, '_blank');
        }
    </script>
</body>
</html>
