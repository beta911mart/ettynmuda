<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecek Format AI - Teman Akademik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library untuk Ekstraksi DOCX dan PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-6">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">AI Format Checker</h1>
            <p class="text-slate-500">Unggah file atau paste draf untuk analisis urutan Bab, Tabel, dan Gambar.</p>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8 mb-6">
            
            <!-- Area Upload File -->
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Unggah Dokumen (PDF, DOCX, TXT):</label>
                <div class="flex items-center justify-center w-full">
                    <label for="fileUpload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-8 h-8 mb-2 text-slate-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                            </svg>
                            <p class="mb-1 text-sm text-slate-500" id="uploadText"><span class="font-semibold">Klik untuk unggah</span> atau seret file ke sini</p>
                            <p class="text-xs text-slate-400">PDF, DOCX, atau TXT</p>
                        </div>
                        <input id="fileUpload" type="file" class="hidden" accept=".pdf, .docx, .txt" onchange="handleFileUpload(event)" />
                    </label>
                </div>
            </div>

            <label for="documentText" class="block text-sm font-semibold text-slate-700 mb-2">
                Atau Teks Kerangka (Hasil ekstraksi file akan muncul di sini):
            </label>
            <textarea id="documentText" rows="10" 
                class="w-full p-4 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Paste draf Skripsi/Makalah Anda di sini..."></textarea>
            
            <div class="mt-4 flex justify-end">
                <button id="checkBtn" onclick="analyzeDocument()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition shadow-sm flex items-center justify-center min-w-[200px]">
                    Cek Format Sekarang
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultArea" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Hasil Analisis AI:</h2>
            <div class="space-y-4">
                <div class="bg-white rounded-lg shadow-sm border border-red-100 p-5">
                    <h3 class="font-semibold text-lg text-slate-800 mb-2 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-red-500 mr-2"></span> Kesalahan Bab/Sub Bab
                    </h3>
                    <ul id="resBab" class="list-disc list-inside text-slate-600 space-y-1 ml-2"></ul>
                </div>
                <div class="bg-white rounded-lg shadow-sm border border-orange-100 p-5">
                    <h3 class="font-semibold text-lg text-slate-800 mb-2 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-orange-500 mr-2"></span> Kesalahan Tabel/Gambar
                    </h3>
                    <ul id="resMedia" class="list-disc list-inside text-slate-600 space-y-1 ml-2"></ul>
                </div>
                <div class="bg-white rounded-lg shadow-sm border border-green-100 p-5">
                    <h3 class="font-semibold text-lg text-slate-800 mb-2 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span> Saran Perbaikan
                    </h3>
                    <ul id="resSuggestion" class="list-disc list-inside text-slate-600 space-y-1 ml-2"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GAS_URL = "GANTI_DENGAN_URL_GAS_ANDA"; 

        // Fungsi Ekstraksi File
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const uploadText = document.getElementById('uploadText');
            const textArea = document.getElementById('documentText');
            uploadText.innerHTML = `<span class="text-blue-500 animate-pulse">Mengekstrak ${file.name}...</span>`;
            textArea.value = "Sedang mengekstrak teks dari dokumen...";

            try {
                if (file.name.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    textArea.value = result.value;
                } 
                else if (file.name.endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const typedarray = new Uint8Array(arrayBuffer);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let text = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    textArea.value = text;
                } 
                else if (file.name.endsWith('.txt')) {
                    const text = await file.text();
                    textArea.value = text;
                } 
                else {
                    throw new Error("Format file tidak didukung.");
                }
                uploadText.innerHTML = `<span class="text-green-600 font-semibold">Berhasil: ${file.name}</span>`;
            } catch (error) {
                uploadText.innerHTML = `<span class="text-red-500 font-semibold">Gagal membaca file!</span>`;
                textArea.value = "";
                alert("Gagal membaca file: " + error.message);
            }
        }

        // Fungsi Analisis AI
        async function analyzeDocument() {
            const text = document.getElementById('documentText').value;
            const btn = document.getElementById('checkBtn');
            const resultArea = document.getElementById('resultArea');

            if(!text.trim() || text === "Sedang mengekstrak teks dari dokumen...") {
                return alert("Teks masih kosong atau sedang diproses!");
            }

            btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-3 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> AI Menganalisis...`;
            btn.disabled = true;
            resultArea.classList.add('hidden');

            try {
const response = await fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({
        action: 'checkFormatAkademik',
        username: 'isi_dengan_username_user_login', // Tarik dari sesi login Anda
        password: 'isi_dengan_password_user_login',
        documentText: text 
    })
});
                
                const data = await response.json();
                
                renderList('resBab', data.bab, 'Urutan Bab dan Sub Bab sudah sesuai.');
                renderList('resMedia', data.media, 'Penomoran Tabel dan Gambar berurutan dengan baik.');
                renderList('resSuggestion', data.saran, 'Tidak ada saran tambahan, format sudah rapi.');
                
                resultArea.classList.remove('hidden');

            } catch (error) {
                alert("Gagal menghubungi server AI. Detail: " + error);
            } finally {
                btn.innerHTML = "Cek Format Sekarang";
                btn.disabled = false;
            }
        }

        function renderList(elementId, arrayData, successMessage) {
            const el = document.getElementById(elementId);
            if (arrayData && arrayData.length > 0) {
                el.innerHTML = arrayData.map(item => `<li>${item}</li>`).join('');
            } else {
                el.innerHTML = `<li class="text-green-600">${successMessage}</li>`;
            }
        }
    </script>
</body>
</html>
