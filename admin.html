    <script>
        // ==========================================
        // KONFIGURASI API
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwjEvkS8po1LcYzW1j-8z8bm_vLr_QQsrkwHVoykheVafC6-ocb-BS4Lmac5cf1EL7C/exec"; 
        const PIN_ADMIN = "1324"; 
        
        // MASUKKAN API KEY IMGBB ANDA DI SINI
        const IMGBB_API_KEY = "67cf3fb6911024b32b4bc4de9b83ed3d"; 

        let globalShopData = [];

        function loginAdmin() {
            if (document.getElementById('admin-pin').value === PIN_ADMIN) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }
        
        function logoutAdmin() { location.reload(); }

        async function loadAdminData() {
            try {
                const response = await fetch(GAS_URL + "?action=getAdminData");
                const data = await response.json();
                
                const shopList = document.getElementById('admin-shop-list');
                if (data.shopData && data.shopData.length > 0) {
                    globalShopData = data.shopData;
                    shopList.innerHTML = data.shopData.map(p => {
                        let arrayGambar = p.imgUrl ? p.imgUrl.split(',') : [];
                        let hArr = p.harga.toString().split('|');
                        let nominal = hArr[0] || 0;
                        let satuan = hArr[1] ? `<span class="text-[10px] text-slate-500 font-normal ml-1">${hArr[1]}</span>` : '';
                        let hargaTampil = `Rp ${Number(nominal).toLocaleString('id-ID')} ${satuan}`;

                        return `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-4 py-3 font-bold text-slate-700 whitespace-normal min-w-[180px]">
                                ${p.nama}
                                <div class="text-[10px] font-normal text-pink-500 mt-1"><i class="fas fa-images"></i> ${arrayGambar.length} Slide Media</div>
                            </td>
                            <td class="px-4 py-3">
                                <span class="block text-xs font-medium text-slate-500 mb-1"><i class="fas fa-graduation-cap"></i> ${p.tingkat}</span>
                                <span class="inline-block bg-slate-100 px-2 py-0.5 rounded text-[10px] text-slate-600 font-bold uppercase">${p.kategori} | ${p.format}</span>
                            </td>
                            <td class="px-4 py-3 text-pink-600 font-bold">${hargaTampil}</td>
                            <td class="px-4 py-3 text-right">
                                <button onclick="bukaEditShop(${p.row})" class="bg-blue-50 text-blue-500 hover:bg-blue-500 hover:text-white px-3 py-1.5 rounded-lg transition mr-1" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="hapusProdukShop(${p.row})" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg transition" title="Hapus">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>`;
                    }).join('');
                } else {
                    shopList.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400 bg-slate-50">Belum ada produk di etalase.</td></tr>';
                }
            } catch (err) { console.error(err); }
        }

        // ==========================================
        // LOGIKA AUTO UPLOAD API IMGBB
        // ==========================================
        async function uploadKeImgBB(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;

            // Jika API Key belum diubah
            if(IMGBB_API_KEY === "MASUKKAN_API_KEY_ANDA_DI_SINI") {
                alert("Harap masukkan API Key ImgBB Anda ke dalam file admin.html baris 330 terlebih dahulu!");
                return;
            }

            // Ambil elemen disekitarnya untuk animasi
            const label = fileInput.parentElement;
            const iconElement = label.querySelector('i');
            const textInput = label.parentElement.querySelector('input[type="text"]');
            
            // Ubah tampilan saat loading
            iconElement.className = "fas fa-spinner fa-spin";
            textInput.disabled = true;
            textInput.placeholder = "Mengunggah ke server...";
            textInput.value = ""; // Bersihkan text sebelumnya

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    textInput.value = data.data.url; // Tulis link secara otomatis!
                } else {
                    alert("Gagal mengunggah: " + (data.error.message || "Unknown error"));
                }
            } catch (error) {
                alert("Koneksi terputus saat mengunggah gambar. Pastikan internet Anda stabil.");
            } finally {
                // Kembalikan UI
                iconElement.className = "fas fa-upload";
                textInput.disabled = false;
                textInput.placeholder = "Paste URL atau Upload Gambar ->";
                fileInput.value = ""; // Reset input file
            }
        }

        // ==========================================
        // FUNGSI MANAJEMEN SHOP & DOM
        // ==========================================
        function tambahInputLink(containerId, inputClass) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = "flex gap-2 relative mt-2 items-center";
            div.innerHTML = `
                <div class="flex-1 flex gap-2">
                    <input type="text" class="${inputClass} w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white" placeholder="Paste URL atau Upload Gambar ->">
                    <label class="bg-blue-50 border border-blue-200 text-blue-600 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition flex items-center justify-center" title="Upload Gambar ke ImgBB">
                        <i class="fas fa-upload"></i>
                        <input type="file" accept="image/*" class="hidden" onchange="uploadKeImgBB(this)">
                    </label>
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-500 px-3 py-2 rounded-lg hover:bg-red-200 transition">
                    <i class="fas fa-trash"></i>
                </button>`;
            container.appendChild(div);
        }
        
        function tambahInputLinkEdit() { tambahInputLink('edit-container-link-gambar', 'input-edit-img-url'); }

        async function simpanProdukShop() {
            const nama = document.getElementById('shop-nama').value.trim();
            const tingkat = document.getElementById('shop-tingkat').value;
            const kategori = document.getElementById('shop-kategori').value;
            const format = document.getElementById('shop-format').value;
            const hargaNominal = document.getElementById('shop-harga').value.trim();
            const hargaUnit = document.getElementById('shop-unit').value;
            
            const inputsLink = document.querySelectorAll('.input-img-url');
            const arrayLink = Array.from(inputsLink).map(input => input.value.trim()).filter(val => val !== "");
            
            if(!nama || !hargaNominal || arrayLink.length === 0) return alert("Lengkapi Nama, Harga, dan minimal 1 Link Media!");

            const btn = document.getElementById('btn-simpan-shop');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; btn.disabled = true;

            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({
                    action: 'addShop', nama: nama, tingkat: tingkat, kategori: kategori, format: format,
                    harga: hargaNominal + '|' + hargaUnit,
                    imgUrl: arrayLink.join(',')
                }) 
            });
            
            // Reset Form Default
            document.getElementById('shop-nama').value = ''; document.getElementById('shop-harga').value = '';
            document.getElementById('shop-unit').value = '';
            document.getElementById('container-link-gambar').innerHTML = `
                <div class="flex gap-2 items-center">
                    <div class="flex-1 flex gap-2">
                        <input type="text" class="input-img-url w-full px-3 py-2 border rounded-lg text-sm bg-white" placeholder="Paste URL atau Upload Gambar ->">
                        <label class="bg-blue-50 border border-blue-200 text-blue-600 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition flex items-center justify-center">
                            <i class="fas fa-upload"></i>
                            <input type="file" accept="image/*" class="hidden" onchange="uploadKeImgBB(this)">
                        </label>
                    </div>
                </div>`;
            
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-1"></i> Upload Produk'; btn.disabled = false;
            loadAdminData();
        }

        async function hapusProdukShop(rowId) {
            if(!confirm("Yakin hapus produk ini?")) return;
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteShop', row: rowId }) });
            loadAdminData();
        }

        // ==========================================
        // FUNGSI EDIT PRODUK SHOP
        // ==========================================
        function bukaEditShop(rowId) {
            const produk = globalShopData.find(p => p.row === rowId);
            if(!produk) return;
            
            document.getElementById('edit-shop-row').value = produk.row;
            document.getElementById('edit-shop-nama').value = produk.nama;
            document.getElementById('edit-shop-tingkat').value = produk.tingkat;
            document.getElementById('edit-shop-kategori').value = produk.kategori;
            document.getElementById('edit-shop-format').value = produk.format;
            
            let hArr = produk.harga.toString().split('|');
            document.getElementById('edit-shop-harga').value = hArr[0] || '';
            document.getElementById('edit-shop-unit').value = hArr[1] || '';

            const imgArr = produk.imgUrl ? produk.imgUrl.split(',').map(u => u.trim()) : [];
            const container = document.getElementById('edit-container-link-gambar');
            container.innerHTML = ''; 
            if(imgArr.length === 0) imgArr.push('');
            
            imgArr.forEach((url, index) => {
                container.innerHTML += `
                <div class="flex gap-2 relative mt-2 items-center">
                    <div class="flex-1 flex gap-2">
                        <input type="text" value="${url}" class="input-edit-img-url w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white" placeholder="Paste URL atau Upload Gambar ->">
                        <label class="bg-blue-50 border border-blue-200 text-blue-600 px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-100 transition flex items-center justify-center">
                            <i class="fas fa-upload"></i>
                            <input type="file" accept="image/*" class="hidden" onchange="uploadKeImgBB(this)">
                        </label>
                    </div>
                    ${index > 0 ? `<button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-500 px-3 py-2 rounded-lg"><i class="fas fa-trash"></i></button>` : ''}
                </div>`;
            });
            
            document.getElementById('edit-shop-modal').classList.remove('hidden');
        }

        function tutupEditShop() { document.getElementById('edit-shop-modal').classList.add('hidden'); }

        async function simpanEditProdukShop() {
            const rowId = document.getElementById('edit-shop-row').value;
            const nama = document.getElementById('edit-shop-nama').value.trim();
            const tingkat = document.getElementById('edit-shop-tingkat').value;
            const kategori = document.getElementById('edit-shop-kategori').value;
            const format = document.getElementById('edit-shop-format').value;
            const hargaNominal = document.getElementById('edit-shop-harga').value.trim();
            const hargaUnit = document.getElementById('edit-shop-unit').value;
            
            const inputsLink = document.querySelectorAll('.input-edit-img-url');
            const arrayLink = Array.from(inputsLink).map(input => input.value.trim()).filter(val => val !== "");

            if(!nama || !hargaNominal || arrayLink.length === 0) return alert("Data belum lengkap!");

            const btn = document.getElementById('btn-simpan-edit-shop');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memperbarui...'; btn.disabled = true;

            await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify({
                    action: 'editShop', row: rowId, nama: nama, tingkat: tingkat, kategori: kategori, format: format,
                    harga: hargaNominal + '|' + hargaUnit,
                    imgUrl: arrayLink.join(',')
                }) 
            });
            
            btn.innerHTML = '<i class="fas fa-save"></i> Update Produk'; btn.disabled = false;
            tutupEditShop(); loadAdminData();
        }
    </script>
</body>
</html>
