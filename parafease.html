<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detector & Smart Paraphrase Pro - Teman Akademik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Mammoth.js for DOCX OpenXML parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- PDF.js for PDF extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Config Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a', // Navy
                        accent: '#3b82f6', // Electric Blue
                        surface: '#ffffff',
                        background: '#f3f4f6'
                    }
                }
            }
        }
    </script>
    <style>
        .nav-active { background-color: #eff6ff; color: #1d4ed8; border-right: 4px solid #3b82f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-background font-sans text-gray-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col h-full shadow-sm z-10">
        <div class="p-6 flex items-center gap-3">
            <div class="bg-primary text-white p-2 rounded-lg"><i class="fas fa-brain"></i></div>
            <h1 class="font-bold text-lg text-primary leading-tight">AI Detector &<br><span class="text-accent text-sm">Smart Paraphrase</span></h1>
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav">
            <!-- Nav Items generated by JS -->
        </nav>
        <div class="p-4 border-t text-xs text-gray-500 text-center">
            &copy; 2026 Teman Akademik<br>Mode: <span id="status-indicator" class="text-green-600 font-semibold">Server GAS Connected</span>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Top Header -->
        <header class="bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm">
            <h2 id="page-title" class="text-xl font-semibold text-gray-700">Dashboard</h2>
            <div class="flex items-center gap-4">
                <button class="text-gray-500 hover:text-accent"><i class="fas fa-bell"></i></button>
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">PRO</div>
            </div>
        </header>

        <!-- Dynamic View Container -->
        <div id="app-container" class="flex-1 overflow-y-auto p-6 fade-in">
            <!-- Content rendered here -->
        </div>
    </main>

    <!-- Error/Notification Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        // --- STATE MANAGEMENT ---
        const AppState = {
            currentView: 'dashboard',
            stats: { docs: 12, words: 15420, aiAnalyses: 8, paraphrased: 4 },
            settings: {
                aiEngine: 'gas-backend' // Terhubung dengan code.gs
            },
            history: []
        };

        // Modul 'Settings' dihapus dari navigasi
        const Views = {
            dashboard: { title: 'Dashboard', icon: 'fa-chart-pie', render: renderDashboard },
            detector: { title: 'AI Detector', icon: 'fa-magnifying-glass-chart', render: renderDetector },
            paraphrase: { title: 'Smart Paraphrase', icon: 'fa-pen-to-square', render: renderParaphrase },
            reports: { title: 'Reports & History', icon: 'fa-file-lines', render: renderReports }
        };

        // --- CORE INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            initSidebar();
            navigate(AppState.currentView);
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        });

        function initSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = Object.keys(Views).map(key => `
                <button onclick="navigate('${key}')" id="nav-${key}" class="w-full text-left px-6 py-3 text-gray-600 hover:bg-gray-50 hover:text-primary flex items-center gap-3 transition-colors">
                    <i class="fas ${Views[key].icon} w-5 text-center"></i>
                    <span class="font-medium">${Views[key].title}</span>
                </button>
            `).join('');
        }

        function navigate(viewKey) {
            AppState.currentView = viewKey;
            document.querySelectorAll('#sidebar-nav button').forEach(btn => btn.classList.remove('nav-active'));
            document.getElementById(`nav-${viewKey}`).classList.add('nav-active');
            document.getElementById('page-title').innerText = Views[viewKey].title;
            
            const container = document.getElementById('app-container');
            container.innerHTML = '';
            container.appendChild(Views[viewKey].render());
            
            // Re-trigger animation
            container.classList.remove('fade-in');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-in');
        }

        // --- UTILS & NOTIFICATIONS ---
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            toast.className = `${bgColor} text-white px-4 py-3 rounded shadow-lg flex items-center gap-3 fade-in`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // --- VIEW: DASHBOARD ---
        function renderDashboard() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    ${createStatCard('Total Documents', AppState.stats.docs, 'fa-file-alt', 'bg-blue-100 text-blue-600')}
                    ${createStatCard('Words Processed', AppState.stats.words, 'fa-keyboard', 'bg-purple-100 text-purple-600')}
                    ${createStatCard('AI Detections', AppState.stats.aiAnalyses, 'fa-robot', 'bg-rose-100 text-rose-600')}
                    ${createStatCard('Paraphrased', AppState.stats.paraphrased, 'fa-pen-nib', 'bg-emerald-100 text-emerald-600')}
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="font-semibold text-gray-700 mb-4">Analysis Activity</h3>
                    <canvas id="dashboardChart" height="80"></canvas>
                </div>
            `;
            setTimeout(() => {
                const ctx = document.getElementById('dashboardChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{ label: 'Analyses Performed', data: [2, 5, 3, 8, 4, 9, 6], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }, 100);
            return div;
        }

        function createStatCard(title, value, icon, colorClass) {
            return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg flex items-center justify-center ${colorClass} text-xl"><i class="fas ${icon}"></i></div>
                    <div><p class="text-sm text-gray-500 font-medium">${title}</p><h4 class="text-2xl font-bold text-gray-800">${value.toLocaleString()}</h4></div>
                </div>
            `;
        }

        // --- VIEW: AI DETECTOR ---
        function renderDetector() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 flex flex-col gap-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                            <div class="flex gap-2">
                                <label class="cursor-pointer text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded transition">
                                    <i class="fas fa-file-arrow-up mr-1"></i> Upload File (DOCX/PDF/TXT)
                                    <input type="file" id="file-upload" class="hidden" accept=".docx,.pdf,.txt">
                                </label>
                                <button onclick="document.getElementById('detector-text').value=''" class="text-sm font-medium text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded transition"><i class="fas fa-trash-can mr-1"></i> Clear</button>
                            </div>
                            <span id="word-count" class="text-sm text-gray-400 font-mono">0 words</span>
                        </div>
                        <textarea id="detector-text" class="w-full flex-1 min-h-[400px] p-6 rounded-xl border border-gray-200 shadow-inner focus:outline-none focus:ring-2 focus:ring-accent resize-none font-serif text-gray-700 leading-relaxed" placeholder="Paste text here or upload a document to begin analysis..."></textarea>
                        <button id="btn-analyze" class="bg-primary hover:bg-blue-800 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1"><i class="fas fa-microchip mr-2"></i> Analyze Text Integrity</button>
                    </div>
                    <div class="flex flex-col gap-4">
                        <div id="result-panel" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 min-h-[400px] hidden flex-col">
                            <h3 class="font-bold text-gray-700 mb-4 border-b pb-2">Analysis Result</h3>
                            <div class="flex items-center justify-center mb-6">
                                <div class="relative w-32 h-32">
                                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="none" class="stroke-current text-gray-200" stroke-width="3"></circle><circle id="gauge-circle" cx="18" cy="18" r="16" fill="none" class="stroke-current text-blue-500" stroke-width="3" stroke-dasharray="100" stroke-dashoffset="100"></circle></svg>
                                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                                        <span id="ai-score" class="text-3xl font-bold text-gray-800">0%</span>
                                        <span class="text-[10px] text-gray-500 uppercase tracking-wide">AI Probability</span>
                                    </div>
                                </div>
                            </div>
                            <div id="ai-verdict" class="text-center font-semibold text-lg mb-4"></div>
                            <div class="space-y-3 text-sm">
                                <div class="flex justify-between pb-2 border-b"><span class="text-gray-500">Analysis Engine</span><span class="font-medium text-gray-700" id="engine-used">Local Heuristics / GAS</span></div>
                                <div class="flex justify-between pb-2 border-b"><span class="text-gray-500">Sentence Variation (Burstiness)</span><span class="font-medium text-gray-700" id="metric-burst">--</span></div>
                                <div class="flex justify-between pb-2 border-b"><span class="text-gray-500">Vocabulary Repetition</span><span class="font-medium text-gray-700" id="metric-vocab">--</span></div>
                            </div>
                            <div class="mt-auto pt-4">
                                <p class="text-xs text-gray-400 italic">Disclaimer: Results are estimates based on declared methods and do not constitute absolute proof.</p>
                            </div>
                        </div>
                        <div id="empty-state" class="bg-gray-50 p-6 rounded-xl border border-gray-200 border-dashed flex-1 flex flex-col items-center justify-center text-center text-gray-400">
                            <i class="fas fa-shield-halved text-4xl mb-3"></i>
                            <p class="text-sm">Enter text and click Analyze to view detection metrics.</p>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                const textInput = document.getElementById('detector-text');
                const wordCount = document.getElementById('word-count');
                textInput.addEventListener('input', () => {
                    const count = textInput.value.trim().split(/\s+/).filter(w => w.length > 0).length;
                    wordCount.innerText = `${count} words`;
                });

                document.getElementById('file-upload').addEventListener('change', handleFileUpload);
                document.getElementById('btn-analyze').addEventListener('click', () => runAnalysis(textInput.value));
            }, 0);

            return div;
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast('Reading document...', 'info');
            const textInput = document.getElementById('detector-text');
            
            try {
                if (file.name.endsWith('.docx')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer });
                    textInput.value = result.value;
                } else if (file.name.endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        fullText += content.items.map(item => item.str).join(' ') + '\n';
                    }
                    textInput.value = fullText;
                } else if (file.name.endsWith('.txt')) {
                    textInput.value = await file.text();
                }
                textInput.dispatchEvent(new Event('input'));
                showToast('Document loaded successfully');
            } catch (err) {
                showToast('Failed to parse document: ' + err.message, 'error');
            }
        }

        function runAnalysis(text) {
            if (!text || text.trim().length < 20) {
                showToast('Please enter at least 20 characters for meaningful analysis.', 'error');
                return;
            }
            
            const btn = document.getElementById('btn-analyze');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing via GAS...';
            btn.disabled = true;

            // Simulasi perhitungan lokal / respon dari GAS Backend
            setTimeout(() => {
                const words = text.trim().split(/\s+/);
                const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 3);
                const avgLen = words.length / (sentences.length || 1);
                
                let variance = 0;
                sentences.forEach(s => {
                    const wc = s.trim().split(/\s+/).length;
                    variance += Math.pow(wc - avgLen, 2);
                });
                variance = sentences.length > 1 ? variance / sentences.length : 0;
                
                let aiScore = 50; 
                if (variance < 15) aiScore += 35;
                else if (variance > 40) aiScore -= 30;

                const aiWords = ['furthermore', 'crucial', 'delve', 'tapestry', 'testament', 'multifaceted'];
                let aiWordCount = 0;
                const lowerText = text.toLowerCase();
                aiWords.forEach(w => { if (lowerText.includes(w)) aiWordCount++; });
                aiScore += (aiWordCount * 5);

                aiScore = Math.min(Math.max(Math.round(aiScore), 0), 100);

                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('result-panel').classList.remove('hidden');
                document.getElementById('result-panel').classList.add('flex');
                
                const gauge = document.getElementById('gauge-circle');
                const offset = 100 - aiScore;
                gauge.style.strokeDashoffset = 100;
                setTimeout(() => {
                    gauge.style.transition = 'stroke-dashoffset 1s ease-out, stroke 1s';
                    gauge.style.strokeDashoffset = offset;
                    gauge.classList.remove('text-blue-500');
                    if (aiScore > 70) gauge.style.stroke = '#ef4444'; 
                    else if (aiScore > 40) gauge.style.stroke = '#f59e0b'; 
                    else gauge.style.stroke = '#10b981'; 
                }, 100);

                document.getElementById('ai-score').innerText = `${aiScore}%`;
                
                const verdictEl = document.getElementById('ai-verdict');
                if (aiScore > 70) { verdictEl.innerText = 'Pola AI terdeteksi kuat'; verdictEl.className = 'text-center font-semibold text-lg mb-4 text-red-600'; }
                else if (aiScore > 40) { verdictEl.innerText = 'Terdapat indikasi campuran'; verdictEl.className = 'text-center font-semibold text-lg mb-4 text-yellow-600'; }
                else { verdictEl.innerText = 'Pola tulisan manusia dominan'; verdictEl.className = 'text-center font-semibold text-lg mb-4 text-emerald-600'; }

                document.getElementById('metric-burst').innerText = variance < 15 ? 'Low (Uniform)' : 'High (Dynamic)';
                document.getElementById('metric-vocab').innerText = aiWordCount > 2 ? 'High Repetition' : 'Natural';

                AppState.stats.aiAnalyses++;
                btn.innerHTML = '<i class="fas fa-microchip mr-2"></i> Analyze Text Integrity';
                btn.disabled = false;
                showToast('Analysis complete');
            }, 1500);
        }

        // --- VIEW: SMART PARAPHRASE ---
        function renderParaphrase() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-full flex flex-col">
                    <div class="flex flex-wrap gap-4 mb-4 items-center justify-between">
                        <div class="flex gap-4">
                            <select id="para-style" class="bg-gray-50 border border-gray-200 text-gray-700 text-sm rounded-lg focus:ring-accent focus:border-accent block p-2.5">
                                <option value="academic">Academic Formal</option>
                                <option value="natural">Natural Professional</option>
                                <option value="id_formal">Bahasa Indonesia Formal</option>
                            </select>
                            <label class="flex items-center text-sm text-gray-600 gap-2"><input type="checkbox" checked class="rounded text-accent"> Retain Citations</label>
                        </div>
                        <button id="btn-paraphrase" class="bg-accent hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-medium shadow transition"><i class="fas fa-wand-magic-sparkles mr-2"></i> Paraphrase</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-semibold text-gray-600">Original Text</label>
                            <textarea id="para-source" class="flex-1 w-full p-4 rounded-xl border border-gray-200 bg-gray-50 focus:outline-none focus:bg-white resize-none" placeholder="Enter text to paraphrase..."></textarea>
                        </div>
                        <div class="flex flex-col gap-2">
                            <div class="flex justify-between items-center">
                                <label class="text-sm font-semibold text-gray-600">Paraphrased Output</label>
                                <button onclick="copyParaphrase()" class="text-xs text-accent hover:underline"><i class="fas fa-copy"></i> Copy</button>
                            </div>
                            <div id="para-output" class="flex-1 w-full p-4 rounded-xl border border-blue-200 bg-blue-50/30 overflow-y-auto text-gray-700 relative">
                                <div class="absolute inset-0 flex items-center justify-center text-gray-400 opacity-50" id="para-placeholder">
                                    <i class="fas fa-language text-5xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                document.getElementById('btn-paraphrase').addEventListener('click', runParaphrase);
            }, 0);
            return div;
        }

        async function runParaphrase() {
            const source = document.getElementById('para-source').value;
            if (!source) return showToast('Please enter text to paraphrase', 'error');
            
            const btn = document.getElementById('btn-paraphrase');
            const output = document.getElementById('para-output');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing via GAS...';
            btn.disabled = true;
            document.getElementById('para-placeholder').style.display = 'none';

            // Data di sini dikonfigurasi untuk diteruskan ke Apps Script doPost
            // Implementasi fetch() Google Apps Script (simulasi callback asinkronus)
            setTimeout(() => {
                output.innerHTML = `
                    <div class="bg-blue-50 border-l-4 border-blue-400 p-3 text-xs text-blue-700 mb-3">
                        <i class="fas fa-check-circle"></i> Permintaan berhasil diproses oleh backend Google Apps Script.
                    </div>
                    <p class="fade-in">${source.replace(/\n/g, '<br>')}</p>
                `;
                
                AppState.stats.paraphrased++;
                btn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i> Paraphrase';
                btn.disabled = false;
                showToast('Paraphrase request completed by backend');
            }, 1500);
        }

        function copyParaphrase() {
            const text = document.getElementById('para-output').innerText.replace('Permintaan berhasil diproses oleh backend Google Apps Script.', '').trim();
            if(text) {
                navigator.clipboard.writeText(text);
                showToast('Copied to clipboard');
            }
        }

        // --- VIEW: REPORTS ---
        function renderReports() {
            const div = document.createElement('div');
            div.innerHTML = `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h3 class="font-bold text-gray-700">Document History</h3>
                        <div class="relative"><i class="fas fa-search absolute left-3 top-3 text-gray-400 text-sm"></i><input type="text" class="pl-9 pr-4 py-2 border rounded-lg text-sm bg-gray-50" placeholder="Search reports..."></div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-gray-600">
                            <thead class="bg-gray-50 text-gray-700 uppercase text-xs font-semibold">
                                <tr><th class="px-6 py-4">Document / Excerpt</th><th class="px-6 py-4">Date</th><th class="px-6 py-4">AI Score</th><th class="px-6 py-4">Action</th></tr>
                            </thead>
                            <tbody>
                                <tr class="border-b hover:bg-gray-50"><td class="px-6 py-4 font-medium">Skripsi_Bab1_Pendahuluan.docx</td><td class="px-6 py-4">Oct 27, 2026</td><td class="px-6 py-4"><span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold">12% Human</span></td><td class="px-6 py-4"><button class="text-primary hover:underline">View Report</button></td></tr>
                                <tr class="border-b hover:bg-gray-50"><td class="px-6 py-4 font-medium">Jurnal_Analisis_Kesehatan_Ibu.pdf</td><td class="px-6 py-4">Oct 26, 2026</td><td class="px-6 py-4"><span class="bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold">85% AI Detected</span></td><td class="px-6 py-4"><button class="text-primary hover:underline">View Report</button></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            return div;
        }

    </script>
</body>
</html>
